name: Build Windows test download
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:database
      - run: npm run build
      - run: npm run typecheck
      - run: ./tools/package-windows.ps1 -OutputDirectory ./dist/windows-ci
      - run: npx playwright install chromium
      - shell: pwsh
        run: |
          Expand-Archive -LiteralPath dist/windows-ci/Med-Assistant-Windows-x64.zip -DestinationPath 'dist/extracted portable'
          $env:PLAYWRIGHT_CHANNEL = 'chromium'
          node tools/test-portable.cjs 'dist/extracted portable/Med-Assistant-Windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Med-Assistant-Windows-x64
          path: |
            dist/windows-ci/Med-Assistant-Windows-x64.zip
            dist/windows-ci/Med-Assistant-Windows-x64.zip.sha256
